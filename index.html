<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Luxury Candle - Boutique & Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1a1a1a;
            --accent-gold: #d4a574;
            --accent-rose: #c894a0;
            --text-main: #f5f5f5;
            --text-muted: #999999;
            --border-color: rgba(212, 165, 116, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #151515;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .status-bar {
            padding: 14px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: #ccc;
        }
        .header-title-zone { padding: 10px 20px 16px; border-bottom: 1px solid var(--border-color); }
        .header-title-zone h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-rose));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-title-zone p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .content-area { flex: 1; overflow-y: auto; padding: 16px 20px 80px; }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .product-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 210px;
        }
        .product-badge { font-size: 10px; color: var(--accent-gold); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .product-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; line-height: 1.2; }
        .product-scent { font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
        .product-bottom {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .product-price { font-size: 15px; font-weight: 700; color: var(--accent-gold); }
        .btn-buy {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-rose));
            border: none;
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .order-item {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .order-top { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .order-ref { font-weight: 700; color: var(--accent-gold); font-size: 14px; }
        .order-pill {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(212, 165, 116, 0.15);
            color: var(--accent-gold);
            font-weight: 600;
        }
        .order-date { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .order-total { font-size: 14px; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); }
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 220px); height: calc(100dvh - 220px); }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; }
        .chat-bubble { max-width: 82%; padding: 12px 16px; border-radius: 16px; font-size: 13px; line-height: 1.45; }
        .chat-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-rose));
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-bubble.ai {
            align-self: flex-start;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: #e5e5e5;
            border-bottom-left-radius: 4px;
        }
        .chat-bar { display: flex; gap: 8px; margin-top: 12px; }
        .chat-bar input {
            flex: 1;
            padding: 12px 16px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .chat-bar button {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-rose));
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bottom-nav {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 68px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 10;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 6px 12px;
            transition: all 0.2s ease;
        }
        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }
        .nav-item.active { color: var(--accent-gold); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="status-bar">
        <span>Luxury Candle</span>
        <span>Boutique</span>
    </div>

    <div class="header-title-zone">
        <h1 id="screen-title">Galerie</h1>
        <p id="screen-desc">Découvrez nos bougies d'exception</p>
    </div>

    <div class="content-area">
        <div id="view-gallery" class="tab-view active">
            <div id="gallery-container" class="product-grid"></div>
        </div>

        <div id="view-orders" class="tab-view">
            <div id="orders-container"></div>
        </div>

        <div id="view-ai" class="tab-view">
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="chat-bubble ai">
                        Bonjour ! Je suis votre conseiller parfum luxe. Décrivez-moi l'ambiance recherchée ou la pièce à parfumer pour vous guider.
                    </div>
                </div>
                <div class="chat-bar">
                    <input type="text" id="chat-input" placeholder="Posez votre question...">
                    <button onclick="handleUserMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="navigate('gallery', 'Galerie', 'Découvrez nos bougies d\'exception', this)">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Galerie</span>
        </button>
        <button class="nav-item" onclick="navigate('orders', 'Commandes', 'Suivez vos commandes en direct', this)">
            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span>Commandes</span>
        </button>
        <button class="nav-item" onclick="navigate('ai', 'Agent IA', 'Votre assistant sensoriel personnalisé', this)">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <span>Agent IA</span>
        </button>
    </nav>
</div>

<script>
    // ---- Configuration ----
    const SUPABASE_URL = 'https://ibbbyaizettvhffhwnwv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_oK8avpphFYLJOhtRkf4TQQ_kMt7FAjz';

    // URL de ton proxy sécurisé (ex. Supabase Edge Function) qui appelle Groq
    // avec la clé stockée côté serveur. Tant qu'elle est vide, le chat
    // affiche un message de repli.
    const CHAT_PROXY_URL = '';

    const fallbackProducts = [
        { id: 1, nom: "Bougie Ambre Étoilé", parfum: "Ambre chaud, Cèdre", prix: 45, stock: "En stock" },
        { id: 2, nom: "Lumière de Vanille", parfum: "Vanille noire Bourbon", prix: 60, stock: "Derniers exemplaires" },
        { id: 3, nom: "Fleur de Cèdre", parfum: "Aiguilles de pin & Cèdre", prix: 38, stock: "En stock" },
        { id: 4, nom: "Douceur du Soir", parfum: "Lavande & Fleur de coton", prix: 48, stock: "En stock" }
    ];

    const fallbackOrders = [
        { id: "12345", date: "24 septembre 2026", montant: 135, statut: "En préparation" },
        { id: "12344", date: "21 septembre 2026", montant: 89, statut: "Expédiée" },
        { id: "12343", date: "18 septembre 2026", montant: 112, statut: "Livrée" }
    ];

    let currentCatalog = fallbackProducts;
    let conversationHistory = [];

    // Échappe le HTML pour éviter l'injection depuis la base de données
    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    document.addEventListener("DOMContentLoaded", () => {
        renderProducts(fallbackProducts);
        renderOrders(fallbackOrders);
        initSupabaseSync();
    });

    function navigate(viewId, title, desc, element) {
        document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`view-${viewId}`).classList.add('active');
        element.classList.add('active');
        document.getElementById('screen-title').textContent = title;
        document.getElementById('screen-desc').textContent = desc;
    }

    function renderProducts(items) {
        const container = document.getElementById("gallery-container");
        container.innerHTML = "";
        items.forEach(p => {
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <div>
                    <div class="product-badge">${esc(p.stock || 'En stock')}</div>
                    <div class="product-name">${esc(p.nom)}</div>
                    <div class="product-scent">${esc(p.parfum || p.parfum_principal || 'Fragrance artisanale')}</div>
                </div>
                <div class="product-bottom">
                    <span class="product-price">${esc(p.prix || 45)} €</span>
                    <button class="btn-buy">Acheter</button>
                </div>`;
            card.querySelector(".btn-buy").addEventListener("click", () => {
                alert("Commande de " + p.nom + " initiée !");
            });
            container.appendChild(card);
        });
    }

    function renderOrders(orders) {
        const container = document.getElementById("orders-container");
        container.innerHTML = orders.map(o => `
            <div class="order-item">
                <div class="order-top">
                    <span class="order-ref">Commande #${esc(o.numero_commande || o.id)}</span>
                    <span class="order-pill">${esc(o.statut)}</span>
                </div>
                <div class="order-date">📅 ${esc(o.date || (o.created_at ? new Date(o.created_at).toLocaleDateString('fr-FR') : 'Date récente'))}</div>
                <div class="order-total">Total: ${esc(o.montant_total || o.montant)} €</div>
            </div>
        `).join('');
    }

    async function initSupabaseSync() {
        if (!window.supabase) return;
        try {
            const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const { data: prods, error: pErr } = await client.from('produits').select('*');
            if (!pErr && prods && prods.length > 0) {
                currentCatalog = prods;
                renderProducts(prods);
            }
            const { data: ords, error: oErr } = await client.from('commandes').select('*');
            if (!oErr && ords && ords.length > 0) {
                renderOrders(ords);
            }
        } catch (e) {
            console.log("Mode local actif.");
        }
    }

    async function handleUserMessage() {
        const input = document.getElementById("chat-input");
        const msg = input.value.trim();
        if (!msg) return;

        const messagesBox = document.getElementById("chat-messages");

        const userBubble = document.createElement("div");
        userBubble.className = "chat-bubble user";
        userBubble.textContent = msg;
        messagesBox.appendChild(userBubble);
        input.value = "";
        messagesBox.scrollTop = messagesBox.scrollHeight;

        conversationHistory.push({ role: "user", content: msg });

        const promptSystem = `Tu es le conseiller et sommelier en bougies parfumées de la maison 'Luxury Candle'.
Voici notre collection :
${currentCatalog.map(p => `- ${p.nom} (${p.prix || 45}€) : ${p.parfum || p.parfum_principal || 'Parfum raffiné'}`).join('\n')}
Conseille avec élégance, raffinement et concision en français.`;

        const loader = document.createElement("div");
        loader.className = "chat-bubble ai";
        loader.textContent = "Recherche de la fragrance idéale...";
        messagesBox.appendChild(loader);
        messagesBox.scrollTop = messagesBox.scrollHeight;

        try {
            if (!CHAT_PROXY_URL) throw new Error("Proxy non configuré");

            const res = await fetch(CHAT_PROXY_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: promptSystem },
                        ...conversationHistory
                    ],
                    max_tokens: 300,
                    temperature: 0.7
                })
            });

            if (!res.ok) throw new Error("Erreur réseau API");

            const data = await res.json();
            const reply = data.choices[0].message.content;
            loader.textContent = reply;
            conversationHistory.push({ role: "assistant", content: reply });
        } catch (err) {
            loader.textContent = "Je reste à votre service pour vous orienter parmi nos créations (Ambre Étoilé, Lumière de Vanille, Fleur de Cèdre, Douceur du Soir).";
        }
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    document.getElementById("chat-input").addEventListener("keypress", (e) => {
        if (e.key === "Enter") handleUserMessage();
    });
</script>

</body>
</html>
